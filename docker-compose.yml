services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - php
  php:
    image: php:8.3-fpm-alpine # or your preferred version
    volumes:
      - ./:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/uploads.ini
